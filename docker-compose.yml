# Wires the app container and the screenshot harness together.
#
#   docker compose up --build --abort-on-container-exit --exit-code-from shots
#
# `app` builds + serves the Flutter web app and reports healthy only once it is
# actually serving. `shots` waits for that healthy signal (proof the app started
# inside the container), then drives it across the device matrix and writes
# screenshots + summary.json into ./artifacts. The compose run exits with the
# harness's exit code, so a broken device fails the whole pipeline.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: custom-redux-web
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  shots:
    build:
      context: ./tooling/screenshots
      dockerfile: Dockerfile
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_URL: "http://app:8080"
      ARTIFACTS_DIR: "/artifacts"
    volumes:
      - ./artifacts:/artifacts
