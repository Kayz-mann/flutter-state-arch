name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.38.7"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Static analysis + unit/widget tests (fast feedback).
  # ---------------------------------------------------------------------------
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2. Build + run the app inside Docker, capture it starting, and screenshot
  #    it across the device matrix. Screenshots are uploaded as artifacts.
  # ---------------------------------------------------------------------------
  web-screenshots:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Start app container and capture startup logs
        run: |
          mkdir -p artifacts
          docker compose up -d app
          # Wait for the container's HEALTHCHECK to report the app is serving.
          status=starting
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q app)" 2>/dev/null || echo starting)
            echo "app health: $status"
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          # Proof the application started inside the container:
          docker compose logs app | tee artifacts/startup-web.log
          if [ "$status" != "healthy" ]; then
            echo "::error::App did not become healthy inside the container"
            exit 1
          fi

      - name: Run multi-device screenshot matrix
        run: docker compose run --rm shots

      - name: Upload web screenshots + startup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-screenshots
          path: artifacts/

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # 3. Launch the app on real Android OS versions in an emulator and screenshot
  #    it, so we know it is not broken across device OS versions.
  # ---------------------------------------------------------------------------
  android-screenshot:
    runs-on: ubuntu-latest
    needs: analyze-test
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator and screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p artifacts
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            adb shell monkey -p com.example.custom_redux -c android.intent.category.LAUNCHER 1
            # Wait for the activity to be resumed (cold emulators show the Flutter
            # splash for several seconds), then let the first frame draw.
            for _ in $(seq 1 40); do
              adb shell dumpsys activity activity com.example.custom_redux 2>/dev/null \
                | grep -q "mResumed=true" && break
              sleep 1
            done
            sleep 4
            # Verify the app is actually running (not crashed on this OS version).
            if ! adb shell pidof com.example.custom_redux >/dev/null; then
              echo "::error::App is not running on Android API ${{ matrix.api-level }}"
              adb logcat -d | tail -200 > artifacts/android-api${{ matrix.api-level }}-crash.log
              exit 1
            fi
            adb exec-out screencap -p > artifacts/android-api${{ matrix.api-level }}.png
            adb logcat -d | grep -i flutter | head -100 \
              > artifacts/android-api${{ matrix.api-level }}-startup.log || true

      - name: Upload Android screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots-api${{ matrix.api-level }}
          path: artifacts/
